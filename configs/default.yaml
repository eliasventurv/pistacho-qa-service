model:
  name: distilbert-base-uncased
  max_seq_length: 384
  doc_stride: 128
  output_dir: artifacts/distilbert-squad2
training:
  dataset: squad_v2
  train_split: train
  val_split: validation
  epochs: 2
  learning_rate: 0.00003
  warmup_ratio: 0.1
  batch_size: 8
  gradient_accumulation_steps: 4
  seed: 42
  max_train_samples: 40000
threshold:
  selected_threshold: 0.0
serving:
  host: 127.0.0.1
  port: 8000
  num_workers: 1
