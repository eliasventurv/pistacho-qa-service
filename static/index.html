<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pistacho QA</title>
<style>
  :root {
    --bg: #f6f7f2; --panel: #ffffff; --ink: #1f2a1c; --muted: #66705f; --line: #dfe3d6;
    --accent: #5a8f29; --accent-ink: #ffffff; --mark: #d9ef9f; --warn: #b4531f; --null: #eef0ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141812; --panel: #1d2319; --ink: #e8eee0; --muted: #9aa58f; --line: #2f3829;
      --accent: #8cc152; --accent-ink: #10140d; --mark: #4b6b22; --warn: #e58a55; --null: #262d21;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  .status { font-size: .85rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--accent); } .dot.bad { background: var(--warn); }
  .sub { color: var(--muted); margin: 4px 0 24px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; font-size: .9rem; margin: 0 0 6px; }
  .field { margin-bottom: 16px; }
  input, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg);
                    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  textarea { min-height: 170px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; font-weight: 600; border-radius: 8px; padding: 10px 18px; cursor: pointer;
           border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
  button:disabled { opacity: .6; cursor: wait; }
  .hint { font-size: .8rem; color: var(--muted); }
  .answer { font-size: 1.5rem; font-weight: 700; margin: 2px 0 8px; word-break: break-word; }
  .answer.null { color: var(--muted); font-weight: 600; }
  .meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
  .bar { height: 6px; background: var(--null); border-radius: 3px; overflow: hidden; margin: 10px 0 16px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .context { white-space: pre-wrap; word-break: break-word; background: var(--bg); border-radius: 8px;
             padding: 12px; border: 1px solid var(--line); max-height: 320px; overflow: auto; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
  .error { color: var(--warn); font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1><span>Pistacho</span> QA</h1>
    <div class="status"><div class="dot" id="dot"></div><span id="status">checking…</span></div>
  </header>
  <p class="sub">Paste an English paragraph and ask a question. The model returns the exact span of the text that answers it, or says the text does not contain the answer.</p>

  <section class="panel">
    <div class="field">
      <label for="token">Access token</label>
      <input id="token" type="password" autocomplete="off" placeholder="Bearer token (QA_API_TOKEN)">
    </div>
    <div class="field">
      <label for="context">Context</label>
      <textarea id="context" maxlength="5000"></textarea>
      <div class="hint"><span id="count">0</span> / 5000 characters</div>
    </div>
    <div class="field">
      <label for="question">Question</label>
      <input id="question" maxlength="500">
    </div>
    <div class="row">
      <button id="ask">Ask</button>
      <button class="ghost" id="ex1">Example</button>
      <button class="ghost" id="ex2">Unanswerable example</button>
    </div>
  </section>

  <section class="panel" id="result" hidden>
    <div class="hint">Answer</div>
    <div class="answer" id="answer"></div>
    <div class="bar"><div id="bar"></div></div>
    <div class="meta">
      <span>confidence <b id="score"></b></span>
      <span>start <b id="start"></b></span>
      <span>time <b id="time"></b></span>
      <span id="model"></span>
    </div>
    <p class="hint" style="margin:16px 0 6px">Where it is in the text</p>
    <div class="context" id="shown"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const LEMPA = "The Lempa River is the longest river in El Salvador, flowing about 422 km from Guatemala to the Pacific Ocean.";
const examples = {
  ex1: [LEMPA, "How long is the Lempa River?"],
  ex2: [LEMPA, "When was the first dam built on the Lempa River?"],
};
try { $("token").value = sessionStorage.getItem("qa-token") || ""; } catch (e) {}

function count() { $("count").textContent = $("context").value.length; }
$("context").addEventListener("input", count);
for (const id in examples) $(id).onclick = () => {
  [$("context").value, $("question").value] = examples[id]; count();
};

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function health() {
  try {
    const r = await fetch("/health");
    const ok = r.status === 200;
    $("dot").className = "dot " + (ok ? "ok" : "bad");
    $("status").textContent = ok ? "model ready" : "model loading…";
    if (!ok) setTimeout(health, 2000);
  } catch (e) { $("dot").className = "dot bad"; $("status").textContent = "offline"; }
}
health();

$("ask").onclick = async () => {
  const token = $("token").value.trim(), context = $("context").value, question = $("question").value.trim();
  if (!token || !context || !question) { alert("Fill in token, context and question."); return; }
  try { sessionStorage.setItem("qa-token", token); } catch (e) {}
  $("ask").disabled = true; $("ask").textContent = "Thinking…";
  const headers = { "Authorization": "Bearer " + token, "Content-Type": "application/json" };
  const t0 = performance.now();
  try {
    const r = await fetch("/predict", { method: "POST", headers,
      body: JSON.stringify({ id: "ui-" + Date.now(), context, question }) });
    const ms = performance.now() - t0;
    const data = await r.json();
    $("result").hidden = false;
    if (!r.ok) {
      $("answer").className = "answer error";
      $("answer").textContent = r.status === 401 ? "Wrong or missing token" : "Error: " + (data.error || r.status);
      $("bar").style.width = "0"; $("score").textContent = $("start").textContent = "–";
      $("time").textContent = Math.round(ms) + " ms"; $("shown").textContent = context;
      return;
    }
    const isNull = data.answer === null;
    $("answer").className = "answer" + (isNull ? " null" : "");
    $("answer").textContent = isNull ? "Not in the text (null)" : data.answer;
    $("score").textContent = (data.score * 100).toFixed(1) + "%";
    $("bar").style.width = (data.score * 100) + "%";
    $("start").textContent = isNull ? "null" : data.start;
    $("time").textContent = Math.round(ms) + " ms";
    $("shown").innerHTML = isNull ? escapeHtml(context) :
      escapeHtml(context.slice(0, data.start)) + "<mark>" + escapeHtml(data.answer) + "</mark>" +
      escapeHtml(context.slice(data.start + data.answer.length));
    fetch("/info", { headers }).then(x => x.ok ? x.json() : null).then(info => {
      if (info) $("model").textContent = info.model + " · " + (info.params / 1e6).toFixed(0) + "M params";
    });
  } catch (e) {
    $("result").hidden = false; $("answer").className = "answer error"; $("answer").textContent = "Service unreachable";
  } finally { $("ask").disabled = false; $("ask").textContent = "Ask"; }
};
</script>
</body>
</html>
